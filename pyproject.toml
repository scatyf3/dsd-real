[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsd-real"
version = "0.1.0"
description = "Real distributed speculative decoding testbed for end-to-end validation of DSD-Sim"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
dsdreal = "dsdreal.target.plugin:register"
dsdreal_probe = "dsdreal.target.plugin:register_probe"

[tool.setuptools.packages.find]
include = ["dsdreal*"]
