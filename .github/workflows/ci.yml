name: CI

# CPU only: the transport layer, proposer, routing, metrics and sim glue are
# tested without vLLM or a GPU (requirements/base.txt guards that boundary).
# GPU gates live in scripts/ and run on the cluster, not here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no GPU stack)
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --timeout 120
